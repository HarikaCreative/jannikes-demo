<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jannikes Catering – Kommer snart</title>
    <meta name="description" content="Ny nettside for Jannikes Catering lanseres i januar 2026">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Lato', sans-serif;
            background: #FFF8E1; /* cream */
            color: #3E2723; /* brun */
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }
        
        /* Fargerike bakgrunnsirkler (Frida Kahlo-inspirert) */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            pointer-events: none;
        }
        
        .bg-circle-1 {
            width: 400px;
            height: 400px;
            background: #E91E63; /* cerise */
            top: -100px;
            right: -100px;
            animation: float 20s ease-in-out infinite;
        }
        
        .bg-circle-2 {
            width: 300px;
            height: 300px;
            background: #8BC6B8; /* turkis */
            bottom: -80px;
            left: -80px;
            animation: float 18s ease-in-out infinite reverse;
        }
        
        .bg-circle-3 {
            width: 200px;
            height: 200px;
            background: #FFB300; /* gul */
            top: 50%;
            left: -50px;
            animation: float 15s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(20px, 20px) scale(1.1);
            }
        }
        
        .content {
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 1;
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Logo */
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 7vw, 5rem);
            font-weight: 700;
            background: linear-gradient(135deg, #E91E63 0%, #FF8F00 50%, #A8D5BA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            animation: fadeIn 1.4s ease-out 0.2s backwards;
        }
        
        .tagline {
            font-family: 'Lato', sans-serif;
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: #8BC6B8; /* turkis */
            margin-bottom: 3rem;
            font-weight: 400;
            animation: fadeIn 1.6s ease-out 0.4s backwards;
        }
        
        /* Hero Image */
        .hero-image {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 3rem;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 
                0 10px 40px rgba(233, 30, 99, 0.15),
                0 4px 15px rgba(139, 198, 184, 0.15);
            border: 3px solid #F06292; /* rosa */
            animation: fadeIn 1.8s ease-out 0.6s backwards;
            position: relative;
        }
        
        .hero-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(233, 30, 99, 0.1), rgba(139, 198, 184, 0.1));
            pointer-events: none;
            z-index: 1;
        }
        
        .hero-image img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s ease;
        }
        
        .hero-image:hover img {
            transform: scale(1.05);
        }
        
        /* Coming Soon Message */
        .message {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeIn 2s ease-out 0.8s backwards;
        }
        
        .message h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 600;
            color: #3E2723; /* brun */
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        
        .message p {
            font-size: clamp(1.125rem, 2.5vw, 1.5rem);
            color: #8BC6B8; /* turkis */
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.7;
            font-weight: 300;
        }
        
        /* Colorful divider */
        .divider {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2.5rem auto;
            animation: fadeIn 2.2s ease-out 1s backwards;
        }
        
        .divider span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .divider span:nth-child(1) {
            background: #E91E63; /* cerise */
            animation-delay: 0s;
        }
        
        .divider span:nth-child(2) {
            background: #FFB300; /* gul */
            animation-delay: 0.2s;
        }
        
        .divider span:nth-child(3) {
            background: #A8D5BA; /* mint */
            animation-delay: 0.4s;
        }
        
        .divider span:nth-child(4) {
            background: #1565C0; /* blå */
            animation-delay: 0.6s;
        }
        
        .divider span:nth-child(5) {
            background: #FF8F00; /* orange */
            animation-delay: 0.8s;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }
        
        /* Contact */
        .contact {
            text-align: center;
            animation: fadeIn 2.4s ease-out 1.2s backwards;
        }
        
        .contact p {
            font-size: 1rem;
            color: #8BC6B8; /* turkis */
            margin-bottom: 0.75rem;
            font-weight: 400;
        }
        
        .contact a {
            font-size: 1.25rem;
            color: #E91E63; /* cerise */
            text-decoration: none;
            font-weight: 700;
            position: relative;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            background: linear-gradient(135deg, rgba(233, 30, 99, 0.1), rgba(139, 198, 184, 0.1));
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .contact a:hover {
            background: linear-gradient(135deg, rgba(233, 30, 99, 0.2), rgba(139, 198, 184, 0.2));
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.2);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }
            
            .logo {
                margin-bottom: 0.25rem;
            }
            
            .tagline {
                margin-bottom: 2rem;
            }
            
            .hero-image {
                margin-bottom: 2rem;
                border-width: 2px;
            }
            
            .message {
                margin-bottom: 2rem;
            }
            
            .divider {
                margin: 2rem auto;
                gap: 0.75rem;
            }
            
            .divider span {
                width: 10px;
                height: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Bakgrunnsirkler -->
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
        <div class="bg-circle bg-circle-3"></div>
        
        <div class="content">
            <h2 class="logo">Jannikes</h2>
            <p class="tagline">Fargerik mat. Varme mennesker. Kreative opplevelser.</p>
            
            <div class="hero-image">
                <img src="sommersalat-jannikes-catering.webp" 
                     alt="Fargerik sommersalat med friske bær og grønnsaker" 
                     loading="eager">
            </div>
            
            <div class="message">
                <h1>Ny nettside lanseres snart</h1>
                <p>Vi gleder oss til å vise frem vår nye nettside i januar 2026. Følg med!</p>
            </div>
            
            <div class="divider">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            
            <div class="contact">
                <p>Har du spørsmål i mellomtiden?</p>
                <a href="mailto:jannike@jannikes.no">jannike@jannikes.no</a>
            </div>
        </div>
    </div>
</body>
</html>
